<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA + OR Parks + Weather Stations</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map{height:100%;margin:0;padding:0}
    .legend{background:#fff;padding:8px;border-radius:4px;box-shadow:0 0 6px rgba(0,0,0,.2)}
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>
// Simple interactive map that loads PAD-US park boundaries (via ArcGIS REST) and
// NOAA GHCN station CSV, filters stations to WA/OR, and displays both layers.
// Open this file locally or host on any static webserver.

const map = L.map('map').setView([46.5, -122.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// PAD-US FeatureServer (ArcGIS) - global USA protected areas (state-level service)
const padusFeatureURL = 'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/USA_Protected_Areas_State/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson';

fetch(padusFeatureURL)
  .then(r => r.json())
  .then(geo => {
    // Filter features to WA or OR by looking for state fields in attributes.
    // PAD-US attributes vary; attempt common field names.
    const keepStates = new Set(['WASHINGTON','OREGON','WA','OR']);
    const filtered = {type:'FeatureCollection',features: geo.features.filter(f=>{
      const a = f.properties || {};
      // check several possible state fields
      const vals = [a.STATE_NAME,a.STATE,a.ST_ABBREV,a.STATE_CODE,a.ST, a.own_name, a.NAME].map(v=>v||'').map(s=>String(s).toUpperCase());
      return vals.some(v=>keepStates.has(v));
    })};

    const parks = L.geoJSON(filtered, {
      style: {color:'#1a7f3b', weight:2, fillOpacity:0.05},
      onEachFeature: (f, layer) => {
        const p = f.properties || {};
        const title = p.own_name || p.NAME || p.DESIGNATION || 'Protected Area';
        layer.bindPopup(title);
      }
    }).addTo(map);

    // zoom to parks bounds if any
    if (filtered.features.length) map.fitBounds(parks.getBounds(), {padding:[20,20]});
  })
  .catch(err => console.error('PAD-US load error', err));

// NOAA GHCN stations CSV
const ghcnCsvUrl = 'https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.csv';

function addStationsFromCsv(text){
  const results = Papa.parse(text.trim(), {header:true, skipEmptyLines:true});
  const data = results.data;
  // Columns usually: id,latitude,longitude,elevation,state,name
  const latKey = Object.keys(data[0]).find(k=>/lat/i.test(k)) || 'latitude';
  const lonKey = Object.keys(data[0]).find(k=>/lon/i.test(k)) || 'longitude';
  const stateKey = Object.keys(data[0]).find(k=>/^state$/i.test(k)) || 'state';
  const nameKey = Object.keys(data[0]).find(k=>/name/i.test(k)) || 'name';

  const markers = L.markerClusterGroup();
  let count=0;
  data.forEach(row=>{
    const st = (row[stateKey]||'').toUpperCase();
    if (st==='WA' || st==='OR'){
      const lat = parseFloat(row[latKey]);
      const lon = parseFloat(row[lonKey]);
      if (!isNaN(lat) && !isNaN(lon)){
        const m = L.marker([lat, lon]);
        m.bindPopup(`<b>${row[nameKey]||row.id||'Station'}</b><br>${row.id||''}<br>${st}`);
        markers.addLayer(m);
        count++;
      }
    }
  });
  markers.addTo(map);
  console.log('Added',count,'stations');
}

fetch(ghcnCsvUrl).then(r=>r.text()).then(addStationsFromCsv).catch(err=>console.error('GHCN CSV load error',err));

// Legend
const legend = L.control({position:'topright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = '<strong>Layers</strong><br><span style="display:inline-block;width:12px;height:12px;background:#1a7f3b;margin-right:6px;"></span> Parks<br><span style="display:inline-block;width:12px;height:12px;background:#3388ff;margin-right:6px;border-radius:6px;"></span> Weather stations (clustered)';
  return div;
};
legend.addTo(map);

</script>
</body>
</html>
